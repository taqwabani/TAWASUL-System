<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إدارة الاستفسارات</title>
    <link rel="stylesheet" href="../CSS/inquiries.css">
    <link rel="stylesheet" href="../CSS/ViewAdminInquiries.css">
</head>

<body>

    <div class="main-wrapper">
         {SIDEBAR}

        <div class="main-content">
            <header class="top-header">
                <div class="page-title">الردود والاستفسارات</div>
                <div class="user-info">
                    <span>المدير : {{ADMIN_NAME}}</span>
                </div>
            </header>
            <div class="main-body">
                <div class="content-header">
                    <h2>قائمة الاستفسارات</h2>
                    <p>عرض وإدارة كافة الرسائل الواردة من أولياء الأمور</p>
                </div>

                <div class="table-card">
                    <table class="inquiry-table">
                        <thead>
                            <tr>
                                <th>ولي الأمر</th>
                                <th>موضوع الاستفسار</th>
                                <th>التاريخ</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{INQUIRIES_TABLE}}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
</body>

</html>
