<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>الجدول الدراسي</title>

    <link rel="stylesheet" href="../CSS/inquiries.css">
    <link rel="stylesheet" href="../CSS/schedule.css">
</head>

<body>

<div class="main-wrapper">
    {SIDEBAR}
    <div class="main-content">
        <header class="top-header">
            <div class="page-title">
                الجدول الدراسي
            </div>
            <div class="user-info">
                <span>ولي الأمر: {{PARENT_NAME}}</span>
            </div>
        </header>
        <main class="content-body">
            <div class="schedule-header">

                <h2>جدول الحصص الدراسية</h2>
                <form method="GET" class="student-selector">
                    <label>اختر الابن:</label>
                    <select name="studentID" onchange="this.form.submit()">
                       {{STUDENT_OPTIONS}}
                    </select>
                </form>
            </div>
            <div class="periods-card">
                <h3>مواعيد الحصص</h3>
                <div class="periods-grid">
                     {{PERIODS_TIMES}}

                </div>

            </div>
            <div class="table-container">
                <table class="schedule-table">

                    <thead>
                        <tr>
                            <th>اليوم</th>
                            <th>الأولى</th>
                            <th>الثانية</th>
                            <th>الثالثة</th>
                            <th>الرابعة</th>
                            <th>الخامسة</th>
                            <th>السادسة</th>
                            <th>السابعة</th>
                        </tr>
                    </thead>

                    <tbody>

                        {{SCHEDULE_ROWS}}

                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>
</body>
</html>
