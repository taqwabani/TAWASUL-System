<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> الاستفسارات - TAWASUL</title>
    <link rel="stylesheet" href="../CSS/inquiries.css">
</head>
<body>

    <div class="main-wrapper">
        {SIDEBAR}
        <div class="main-content">
            <header class="top-header">
                <div class="page-title">مركز الاستفسارات</div>
                <div class="user-info">
                    <span>ولي الأمر: {{PARENT_NAME}}</span>
                </div>
            </header>

            <div class="content-body">
                <div class="card send-inquiry-card">
                    <div class="card-header">
                        <h3>إرسال استفسار جديد</h3>
                        <p>يمكنك من خلال هذه الصفحة إرسال تساؤلاتك واستفساراتك.</p>
                            {{SUCCESS_MESSAGE}}
                    </div>
                    <form action="inquiries.php" method="POST">
                        <div class="form-row">
                            <div class="form-group">
                                <label>عنوان الاستفسار</label>
                                <input type="text" name="subject" placeholder="أدخل عنواناً واضحاً ومختصراً..." required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group full-width">
                                <label>نص الرسالة</label>
                                <textarea name="message" rows="5" placeholder="اكتب استفسارك هنا بشكل مفصل ..." required></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" name="send"  class="btn-primary">
                                <img src="../images/lucide-Send.svg" class="btn-icon">
                                إرسال الاستفسار
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card history-card">
                    <div class="card-header">
                        <h3>قائمة الاستفسارات السابقة</h3>
                    </div>
                    <table class="data-table">
                      <thead>
                          <tr>
                             <th>الإجراءات</th>
                             <th>التاريخ</th>
                             <th>العنوان</th>
                             <th>الحالة</th>
                          </tr>
                     </thead>
                     <tbody>
                        {{INQUIRIES}}
                      </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
