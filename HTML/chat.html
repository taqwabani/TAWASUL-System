</head>

<body>

    <div class="main-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="../images/BookOpen.svg" alt="Logo" class="logo-icon">
                    <h2>TAWASUL</h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="../pages/dashboardA.php">
                    <img src="../images/lucide-LayoutDashboard.svg" class="nav-icon"> الرئيسية
                </a>
                <a href="../pages/adminAnnouncements.PHP">
                    <img src="../images/lucide-Megaphone.svg" class="nav-icon"> ادارة الاعلانات
                </a>
                <a href="../pages/u.PHP">
                    <img src="../images/lucide-Users.svg" class="nav-icon"> ادارة المستخدمين
                </a>
                <a href="../pages/ViewAdminInquiries.php">
                    <img src="../images/lucide-MessageSquare.svg" class="nav-icon"> ردود والاستفسارات
                </a>
                <a href="notifications.html">
                    <img src="../images/lucide-Bell.svg" class="nav-icon"> الإشعارات
                </a>
            </nav>
        </aside>

        <div class="main-content">
            <header class="top-header">
                <div class="page-title">مركز الاستفسارات</div>
                <div class="user-info"><span>المدير : سالم</span></div>
            </header>

            <div class="chat-container">
                <a href="ViewAdminInquiries.php" class="back-link">
                    <span>
                        < </span> العودة لقائمة الاستفسارات
                </a>

                <div class="inquiry-info-card">
                    <h3>بيانات الاستفسار</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <strong>اسم ولي الأمر</strong>
                            <span>{{parentName}}</span>
                        </div>
                        <div class="info-item">
                            <strong>موضوع الاستفسار</strong>
                            <span>{{subject}}</span>
                        </div>
                        <div class="info-item">
                            <strong>تاريخ الارسال</strong>
                            <span>{{date}}</span>
                        </div>
                    </div>
                </div>

                <div class="messages-thread">
                    <p>{{chatContent}}</p>
                </div>

                <div class="reply-box">
                    <form action="sendReply.php" method="POST">
                        <input type="hidden" name="inquiryID" value="{{inquiryID}}">
                        <textarea name="messageText" rows="4" placeholder="اكتب ردك هنا..."></textarea>
                        <button type="submit" class="send-btn">
                            <img src="../images/lucide-Send.svg">
                            إرسال الرد الآن
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
