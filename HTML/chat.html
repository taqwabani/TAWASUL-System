<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!-- ملف المحادثة لرد على الاستفسارات الخاصة بالادارة-->
<head>
    <meta charset="UTF-8">
    <title>مركز الاستفسارات - رد</title>
    <link rel="stylesheet" href="../CSS/inquiries.css">
    <link rel="stylesheet" href="../CSS/chat.css">
</head>

<body>

    <div class="main-wrapper">
                    {SIDEBAR}

        <div class="main-content">
            <header class="top-header">
                <div class="page-title">مركز الاستفسارات</div>
                <div class="user-info"><span>المدير : {{ADMIN_NAME}}</span></div>
            </header>

            <div class="chat-container">
                <a href="ViewAdminInquiries.php" class="back-link">
                    <span>
                         </span> العودة لقائمة الاستفسارات
                </a>

                <div class="inquiry-info-card">
                    <h3>بيانات الاستفسار</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <strong>اسم ولي الأمر</strong>
                            <span>{{parentName}}</span>
                        </div>
                        <div class="info-item">
                            <strong>موضوع الاستفسار</strong>
                            <span>{{subject}}</span>
                        </div>
                        <div class="info-item">
                            <strong>تاريخ الارسال</strong>
                            <span>{{date}}</span>
                        </div>
                    </div>
                </div>

                <div class="messages-thread">
                    <p>{{chatContent}}</p>
                </div>

                <div class="reply-box">
                    <form action="sendReply.php" method="POST">
                        <input type="hidden" name="inquiryID" value="{{inquiryID}}">
                        <textarea name="messageText" rows="4" placeholder="اكتب ردك هنا..."></textarea>
                        <button type="submit" class="send-btn">
                            <img src="../images/lucide-Send.svg">
                            إرسال الرد الآن
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
