<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تعديل إعلان - TAWASUL</title>
    <link rel="stylesheet" href="../CSS/inquiries.css">
    <link rel="stylesheet" href="../CSS/adminAnnouncements.css">
</head>

<body>
    <div class="main-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="../images/BookOpen.svg" alt="Logo" class="logo-icon">
                    <h2>TAWASUL</h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="../pages/dashboardA.php"><img src="../images/lucide-LayoutDashboard.svg" class="nav-icon">
                    الرئيسية</a>
                <a href="../pages/adminAnnouncements.PHP" class="active"><img src="../images/lucide-Megaphone.svg"
                        class="nav-icon"> ادارة الاعلانات</a>
                <a href="../pages/u.PHP"><img src="../images/lucide-Users.svg" class="nav-icon"> ادارة المستخدمين</a>
                <a href="../pages/ViewAdminInquiries.php"><img src="../images/lucide-MessageSquare.svg"
                        class="nav-icon"> ردود والاستفسارات</a>
            </nav>
        </aside>

        <div class="main-content">
            <header class="top-header">
                <div class="page-title">تعديل الإعلان</div>
                <div class="user-info">
                    <span>المدير</span>
                </div>
            </header>
            
            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h3>تحديث بيانات الإعلان</h3>
                        <p>قم بتعديل الحقول أدناه ثم اضغط حفظ التغييرات</p>
                    </div>

                    {{SUCCESS_MESSAGE}}

                    <form action="../pages/editAnnouncement.php?id={{ID}}" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="title">عنوان الإعلان</label>
                            <input type="text" id="title" name="title" value="{{TITLE}}" required>
                        </div>

                        <div class="form-group">
                            <label for="content">محتوى الإعلان</label>
                            <textarea id="content" name="content" rows="6" required>{{CONTENT}}</textarea>
                        </div>

                        <div class="form-group">
                            <label>الصورة الحالية</label>
                            {{CURRENT_IMAGE}}
                            <input type="file" name="announcementImage" accept="image/*">
                        </div>

                        <button type="submit" class="btn-primary">حفظ التغييرات</button>
                        <a href="adminAnnouncements.PHP" style="margin-right: 15px; color: #666;">إلغاء</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
