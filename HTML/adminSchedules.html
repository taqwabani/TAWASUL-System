<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>إدارة الجداول الدراسية - TAWASUL</title>
    <link rel="stylesheet" href="../CSS/inquiries.css">
    <link rel="stylesheet" href="../CSS/adminAnnouncements.css">
    <link rel="stylesheet" href="../CSS/schedules.css">
</head>

<body>
    <div class="main-wrapper">
        {SIDEBAR}
        <div class="main-content">
            <header class="top-header">
                <div class="page-title">إدارة الجدول الدراسي</div>
            </header>

            <div class="announcement-container">
                <div class="page-header">
                    <div class="header-text">
                        <h2>إضافة حصة جديدة</h2>
                        <p>قم بتعبئة المادة واليوم ورقم الحصة لكل صف دراسي</p>
                    </div>
                </div>

                <div class="status-msg">{{MSG}}</div>

                <form method="POST" class="schedule-form">
                    <div class="form-row">
                        <div class="input-group">
                            <label>الصف الدراسي</label>
                            <select name="classID" required>{{CLASS_OPTIONS}}</select>
                        </div>
                        <div class="input-group">
                            <label>اليوم</label>
                            <select name="dayName" required>
                                <option value="الأحد">الأحد</option>
                                <option value="الإثنين">الإثنين</option>
                                <option value="الثلاثاء">الثلاثاء</option>
                                <option value="الأربعاء">الأربعاء</option>
                                <option value="الخميس">الخميس</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>رقم الحصة</label>
                            <input type="number" name="periodNumber" min="1" max="8" required>
                        </div>
                        <div class="input-group">
                            <label>اسم المادة</label>
                            <input type="text" name="subjectName" placeholder="مثال: رياضيات" required>
                        </div>
                    </div>
                    <button type="submit" name="add_period" class="btn-primary-dark">إضافة للحصة</button>
                </form>

                <div class="table-responsive">
                    <table class="announcement-table">
                        <thead>
                            <tr>
                                <th>الصف</th>
                                <th>اليوم</th>
                                <th>الحصة</th>
                                <th>المادة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody>{{SCHEDULES_TABLE}}</tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
