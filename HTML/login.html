<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام تواصل</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="login-card">
            <!-- الجزء الأيمن: الشعار والخلفية  -->
            <div class="brand-section">
                <div class="logo-box">
                    <img src="images/BookOpen.svg" alt="Logo">
                </div>
                <h1 class="brand-name">TAWASUL</h1>
            </div>

            <!-- الجزء الأيسر: نموذج تسجيل الدخول -->
            <div class="form-section">
                <h2>نظام التواصل المدرسي</h2>
                <p class="welcome-text">مرحباً بك مجدداً. يرجى إدخال بيانات اعتمادك للوصول إلى لوحة التحكم الخاصة بك.</p>
                 
                <form action="login.php" method="POST" >
                    <div class="input-group">
                        
                        <label>اسم المستخدم</label>
                        <div class="input-wrapper">
                            <input type="text" name="userName" placeholder="أدخل المعرف الخاص بك" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>كلمة المرور</label>
                        <div class="input-wrapper">
                            <input type="password" id="myPass" name="password" placeholder="••••••••" required>
                        </div>
                        <span style="color: red; font-size: 16px;" class="error" >{{ERROR}}</span>
                        <div style="margin-top: 5px; font-size: 13px; color: #666;">
                              <input type="checkbox" onclick="document.getElementById('myPass').type = this.checked ? 'text' : 'password'"> 
                                      إظهار كلمة المرور
                        </div>
                        
                    </div>

                    <button type="submit" name="loginBtn" class="btn-login">تسجيل دخول</button>
                </form>
            </div>
        </div>
 
        </div>
    </div>
</body>
</html>
